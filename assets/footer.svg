<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Micro-grid pattern -->
    <pattern id="foot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0A0D12" stroke-width="0.2" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Cream editorial background -->
  <rect width="900" height="170" fill="#F0EAE1"/>
  <rect width="900" height="170" fill="url(#foot-grid)"/>

  <!-- Top double framing rules -->
  <line x1="32" y1="16" x2="868" y2="16" stroke="#0A0D12" stroke-width="1.2"/>
  <line x1="32" y1="20" x2="868" y2="20" stroke="#0A0D12" stroke-width="0.3" opacity="0.4"/>

  <!-- Left Colophon Identity -->
  <g transform="translate(32, 42)">
    <rect x="0" y="2" width="6" height="6" fill="#1E40AF"/>
    <text x="14" y="8" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" font-weight="700" fill="#1E40AF" letter-spacing="2">COLOPHON // HYDRA LAB</text>

    <text x="0" y="38"
          font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
          font-size="24"
          font-weight="900"
          fill="#0A0D12"
          letter-spacing="0.5">HYDRA // DIGITAL LAB</text>

    <text x="0" y="58" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#0A0D12" letter-spacing="0.5">
      DHAWAL GOYAL <tspan fill="#1E40AF">(@HydraDocOc)</tspan> · NEW DELHI, INDIA
    </text>

    <text x="0" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#0A0D12" opacity="0.6" letter-spacing="0.8">
      COMPUTATIONAL INTELLIGENCE · VERIFIED SYSTEMS · VISUAL MEDIA
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="470" y1="36" x2="470" y2="136" stroke="#0A0D12" stroke-width="0.3" opacity="0.2"/>

  <!-- Center Colophon Technical Notes -->
  <g transform="translate(490, 42)">
    <text x="0" y="8" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" font-weight="700" fill="#0A0D12" letter-spacing="2" opacity="0.7">PRODUCTION NOTES</text>

    <text x="0" y="28" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#0A0D12" opacity="0.8">
      PALETTE: PAPIER #F0EAE1 · INK #0A0D12 · COBALT #1E40AF
    </text>

    <text x="0" y="44" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#0A0D12" opacity="0.8">
      GRID: 30mm ARCHITECTURAL SWISS RHYTHM
    </text>

    <text x="0" y="60" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#0A0D12" opacity="0.8">
      REPOSITORIES: ALL 8 PROFILES VERIFIED ON-SOURCE
    </text>

    <text x="0" y="76" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#1E40AF" font-weight="600">
      PORTFOLIO REVISION: AUTUMN 2026 EDITION
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="740" y1="36" x2="740" y2="136" stroke="#0A0D12" stroke-width="0.3" opacity="0.2"/>

  <!-- Right Authentic Barcode & Registration Stamp -->
  <g transform="translate(760, 48)">
    <text x="0" y="2" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" font-weight="600" fill="#0A0D12" letter-spacing="1" opacity="0.6">REGISTRATION</text>

    <!-- Barcode -->
    <g transform="translate(0, 10)" opacity="0.8">
      <rect x="0" y="0" width="1.5" height="32" fill="#0A0D12"/>
      <rect x="3" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="6" y="0" width="2.5" height="32" fill="#0A0D12"/>
      <rect x="11" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="14" y="0" width="3" height="32" fill="#0A0D12"/>
      <rect x="19" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="22" y="0" width="2" height="32" fill="#0A0D12"/>
      <rect x="26" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="29" y="0" width="3.5" height="32" fill="#0A0D12"/>
      <rect x="35" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="38" y="0" width="2" height="32" fill="#0A0D12"/>
      <rect x="42" y="0" width="1.5" height="32" fill="#0A0D12"/>
      <rect x="46" y="0" width="3" height="32" fill="#0A0D12"/>
      <rect x="51" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="54" y="0" width="2" height="32" fill="#0A0D12"/>
      <rect x="58" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="61" y="0" width="2.5" height="32" fill="#0A0D12"/>
      <rect x="66" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="69" y="0" width="3" height="32" fill="#0A0D12"/>
      <rect x="74" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="77" y="0" width="2" height="32" fill="#0A0D12"/>
      <rect x="82" y="0" width="1.5" height="32" fill="#0A0D12"/>
      <rect x="86" y="0" width="3" height="32" fill="#0A0D12"/>
      <rect x="91" y="0" width="1" height="32" fill="#0A0D12"/>
      <rect x="94" y="0" width="2" height="32" fill="#0A0D12"/>
      <text x="0" y="44" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#0A0D12" letter-spacing="1">HDL-2026-COLOPHON</text>
    </g>

    <text x="0" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" fill="#1E40AF" font-weight="600" letter-spacing="1">
      STATUS: VERIFIED
    </text>
  </g>

  <!-- Bottom rule -->
  <line x1="32" y1="152" x2="868" y2="152" stroke="#0A0D12" stroke-width="0.8"/>
</svg>

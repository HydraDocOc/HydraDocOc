<svg width="900" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark micro-grid pattern -->
    <pattern id="vis-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#CBD0D6" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Deep ink black background -->
  <rect width="900" height="290" fill="#0A0D12"/>
  <rect width="900" height="290" fill="url(#vis-grid)"/>

  <!-- Precision edge cobalt accents -->
  <rect x="0" y="0" width="3" height="290" fill="#1E40AF"/>
  <rect x="897" y="0" width="3" height="290" fill="#1E40AF"/>

  <!-- Top hairline framing -->
  <line x1="32" y1="20" x2="868" y2="20" stroke="#CBD0D6" stroke-width="0.4" opacity="0.25"/>

  <!-- Section index tag -->
  <text x="32" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" font-weight="600" fill="#CBD0D6" letter-spacing="3" opacity="0.6">INDEX // 06</text>
  <text x="140" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" letter-spacing="1.5" opacity="0.4">CREATIVE COMPUTE &amp; CINEMATIC EXTENSION</text>
  <text x="730" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#1E40AF" letter-spacing="1">FIVE DISCIPLINES</text>

  <!-- Section title -->
  <text x="32" y="48"
        font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
        font-size="22"
        font-weight="900"
        fill="#F0EAE1"
        letter-spacing="1.5">/// VISUAL SYSTEMS</text>

  <text x="32" y="66" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="9" fill="#CBD0D6" opacity="0.7">
    Where code meets image: cinematography, typography, and procedural aesthetics as rigorous systems.
  </text>

  <line x1="32" y1="76" x2="868" y2="76" stroke="#CBD0D6" stroke-width="0.3" opacity="0.2"/>

  <!-- ===================================================================
       FIVE EQUAL-WIDTH EDITORIAL DISCIPLINE CARDS (154px width each)
       =================================================================== -->

  <!-- CARD 01: FILM -->
  <g transform="translate(32, 92)">
    <rect width="154" height="136" fill="none" stroke="#CBD0D6" stroke-width="0.4" opacity="0.3"/>
    <rect width="154" height="2.5" fill="#1E40AF"/>

    <text x="14" y="24" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" font-weight="700" fill="#60A5FA" letter-spacing="1.5">DISCIPLINE.01</text>
    <text x="14" y="48" font-family="'Arial Black','Impact','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#F0EAE1" letter-spacing="1">FILM</text>
    <line x1="14" y1="56" x2="140" y2="56" stroke="#CBD0D6" stroke-width="0.25" opacity="0.2"/>

    <text x="14" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Cinematography</text>
    <text x="14" y="90" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Narrative Rhythm</text>
    <text x="14" y="106" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Visual Direction</text>
    <text x="14" y="122" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#60A5FA">OPTICAL</text>
  </g>

  <!-- CARD 02: PHOTO -->
  <g transform="translate(202, 92)">
    <rect width="154" height="136" fill="none" stroke="#CBD0D6" stroke-width="0.4" opacity="0.3"/>
    <rect width="154" height="2.5" fill="#1E40AF"/>

    <text x="14" y="24" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" font-weight="700" fill="#60A5FA" letter-spacing="1.5">DISCIPLINE.02</text>
    <text x="14" y="48" font-family="'Arial Black','Impact','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#F0EAE1" letter-spacing="1">PHOTO</text>
    <line x1="14" y1="56" x2="140" y2="56" stroke="#CBD0D6" stroke-width="0.25" opacity="0.2"/>

    <text x="14" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Framing &amp; Angle</text>
    <text x="14" y="90" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Natural Light Study</text>
    <text x="14" y="106" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Architecture Study</text>
    <text x="14" y="122" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#60A5FA">GEOMETRY</text>
  </g>

  <!-- CARD 03: EDITING -->
  <g transform="translate(372, 92)">
    <rect width="154" height="136" fill="none" stroke="#CBD0D6" stroke-width="0.4" opacity="0.3"/>
    <rect width="154" height="2.5" fill="#F0EAE1" opacity="0.8"/>

    <text x="14" y="24" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" font-weight="700" fill="#CBD0D6" letter-spacing="1.5">DISCIPLINE.03</text>
    <text x="14" y="48" font-family="'Arial Black','Impact','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#F0EAE1" letter-spacing="1">EDITING</text>
    <line x1="14" y1="56" x2="140" y2="56" stroke="#CBD0D6" stroke-width="0.25" opacity="0.2"/>

    <text x="14" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">DaVinci Resolve</text>
    <text x="14" y="90" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Color Grading</text>
    <text x="14" y="106" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Sound &amp; Pacing</text>
    <text x="14" y="122" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#CBD0D6" opacity="0.6">POST-PROD</text>
  </g>

  <!-- CARD 04: DESIGN -->
  <g transform="translate(542, 92)">
    <rect width="154" height="136" fill="none" stroke="#CBD0D6" stroke-width="0.4" opacity="0.3"/>
    <rect width="154" height="2.5" fill="#F0EAE1" opacity="0.8"/>

    <text x="14" y="24" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" font-weight="700" fill="#CBD0D6" letter-spacing="1.5">DISCIPLINE.04</text>
    <text x="14" y="48" font-family="'Arial Black','Impact','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#F0EAE1" letter-spacing="1">DESIGN</text>
    <line x1="14" y1="56" x2="140" y2="56" stroke="#CBD0D6" stroke-width="0.25" opacity="0.2"/>

    <text x="14" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Adobe Suite</text>
    <text x="14" y="90" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Editorial Systems</text>
    <text x="14" y="106" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Visual Identity</text>
    <text x="14" y="122" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#CBD0D6" opacity="0.6">TYPOGRAPHY</text>
  </g>

  <!-- CARD 05: PROCEDURAL / AI -->
  <g transform="translate(714, 92)">
    <rect width="154" height="136" fill="none" stroke="#CBD0D6" stroke-width="0.4" opacity="0.3"/>
    <rect width="154" height="2.5" fill="#1E40AF"/>

    <text x="14" y="24" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" font-weight="700" fill="#60A5FA" letter-spacing="1.5">DISCIPLINE.05</text>
    <text x="14" y="48" font-family="'Arial Black','Impact','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#F0EAE1" letter-spacing="1">PROCEDURAL</text>
    <line x1="14" y1="56" x2="140" y2="56" stroke="#CBD0D6" stroke-width="0.25" opacity="0.2"/>

    <text x="14" y="74" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">AI x Aesthetics</text>
    <text x="14" y="90" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Generative Media</text>
    <text x="14" y="106" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" opacity="0.75">Visual Coding</text>
    <text x="14" y="122" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#60A5FA">EXPLORATORY</text>
  </g>

  <!-- Editorial footer note -->
  <g transform="translate(32, 252)">
    <line x1="0" y1="0" x2="836" y2="0" stroke="#CBD0D6" stroke-width="0.3" opacity="0.2"/>
    <text x="0" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#CBD0D6" letter-spacing="1" opacity="0.5">
      LAB STATEMENT // Visual storytelling and architectural design inform code structure: clarity, rhythm, and zero waste.
    </text>
  </g>
</svg>

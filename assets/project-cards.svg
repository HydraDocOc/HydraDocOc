  <text x="476" y="191" font-family="'IBM Plex Mono','Courier New',monospace" font-size="9" fill="#BFC3C7" opacity="0.8">resume builder functionality. Built using external</text>
  <text x="476" y="205" font-family="'IBM Plex Mono','Courier New',monospace" font-size="9" fill="#BFC3C7" opacity="0.8">APIs for live job data and resume generation.</text>

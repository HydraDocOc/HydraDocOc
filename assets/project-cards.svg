  <text x="30" y="38" font-family="'IBM Plex Mono','Courier New',monospace" font-size="8" fill="#080A0D" letter-spacing="2" opacity="0.5">03  —  SELECTED SYSTEMS</text>
  <text x="30" y="60"
        font-family="'Arial Black','Impact','Arial',sans-serif"

  <text x="46" y="177" font-family="'IBM Plex Mono','Courier New',monospace" font-size="9" fill="#BFC3C7" opacity="0.8">Conversational AI system that processes PDF</text>
  <text x="46" y="191" font-family="'IBM Plex Mono','Courier New',monospace" font-size="9" fill="#BFC3C7" opacity="0.8">documents and answers natural language queries</text>
  <text x="46" y="205" font-family="'IBM Plex Mono','Courier New',monospace" font-size="9" fill="#BFC3C7" opacity="0.8">using Google Gemini's LLM capabilities.</text>

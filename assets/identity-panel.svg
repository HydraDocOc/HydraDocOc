<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Technical micro-grid -->
    <pattern id="dark-editorial-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#CBD0D6" stroke-width="0.2" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Deep ink black background -->
  <rect width="900" height="280" fill="#0A0D12"/>
  <rect width="900" height="280" fill="url(#dark-editorial-grid)"/>

  <!-- Precision cobalt edge registration accents -->
  <rect x="0" y="0" width="3" height="280" fill="#1E40AF"/>
  <rect x="897" y="0" width="3" height="280" fill="#1E40AF"/>

  <!-- Top hairline framing -->
  <line x1="32" y1="24" x2="868" y2="24" stroke="#CBD0D6" stroke-width="0.4" opacity="0.25"/>

  <!-- Section index tag -->
  <text x="32" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" font-weight="600" fill="#CBD0D6" letter-spacing="3" opacity="0.6">INDEX // 02</text>
  <text x="140" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#CBD0D6" letter-spacing="1.5" opacity="0.4">ENGINEERING PROFILE &amp; PRACTITIONER DOSSIER</text>
  <text x="740" y="16" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" fill="#1E40AF" letter-spacing="1">SYSTEM CLASSIFICATION</text>

  <!-- Left block: Name & Identity statement -->
  <g transform="translate(32, 54)">
    <!-- Main Name -->
    <text x="0" y="52"
          font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
          font-size="62"
          font-weight="900"
          fill="#F0EAE1"
          letter-spacing="-2">DHAWAL GOYAL</text>

    <!-- Handle & Network identity -->
    <text x="2" y="78"
          font-family="'IBM Plex Mono','SF Mono',Consolas,monospace"
          font-size="12"
          font-weight="700"
          fill="#1E40AF"
          letter-spacing="3">@HydraDocOc</text>
    <text x="145" y="78"
          font-family="'IBM Plex Mono','SF Mono',Consolas,monospace"
          font-size="9"
          fill="#CBD0D6"
          letter-spacing="1"
          opacity="0.4">· github.com/HydraDocOc</text>

    <!-- Hairline divider -->
    <line x1="2" y1="92" x2="480" y2="92" stroke="#CBD0D6" stroke-width="0.4" opacity="0.25"/>

    <!-- Professional role descriptor -->
    <text x="2" y="112"
          font-family="'IBM Plex Mono','SF Mono',Consolas,monospace"
          font-size="9"
          font-weight="600"
          fill="#CBD0D6"
          letter-spacing="1.5"
          opacity="0.8">SOFTWARE SYSTEMS · APPLIED MACHINE LEARNING · VISUAL MEDIA</text>

    <!-- Guiding thesis statement -->
    <text x="2" y="136"
          font-family="'IBM Plex Mono','SF Mono',Consolas,monospace"
          font-size="10.5"
          fill="#F0EAE1"
          letter-spacing="0.5"
          opacity="0.95">Building intelligent, verifiable software architectures with a visual mind.</text>
    <text x="2" y="152"
          font-family="'IBM Plex Mono','SF Mono',Consolas,monospace"
          font-size="8.5"
          fill="#CBD0D6"
          letter-spacing="0.5"
          opacity="0.5">Dual-focus practice combining rigorous engineering with cinematic narrative design.</text>
  </g>

  <!-- Vertical dossier partition rule -->
  <line x1="540" y1="36" x2="540" y2="256" stroke="#CBD0D6" stroke-width="0.4" opacity="0.2"/>

  <!-- Right block: Editorial Specification Ledger -->
  <g transform="translate(565, 52)">
    <text x="0" y="0" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" font-weight="700" fill="#1E40AF" letter-spacing="2">SPECIFICATION LEDGER</text>
    <line x1="0" y1="8" x2="303" y2="8" stroke="#CBD0D6" stroke-width="0.3" opacity="0.2"/>

    <!-- Row 1: Jurisdiction -->
    <text x="0" y="32" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#CBD0D6" letter-spacing="1.5" opacity="0.5">LOCATION</text>
    <text x="110" y="32" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#F0EAE1" letter-spacing="1">NEW DELHI, INDIA</text>
    <line x1="0" y1="42" x2="303" y2="42" stroke="#CBD0D6" stroke-width="0.2" opacity="0.15"/>

    <!-- Row 2: Discipline -->
    <text x="0" y="66" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#CBD0D6" letter-spacing="1.5" opacity="0.5">DISCIPLINE</text>
    <text x="110" y="66" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#F0EAE1" letter-spacing="1">COMPUTER SCIENCE &amp; ENG.</text>
    <line x1="0" y1="76" x2="303" y2="76" stroke="#CBD0D6" stroke-width="0.2" opacity="0.15"/>

    <!-- Row 3: Focus -->
    <text x="0" y="100" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#CBD0D6" letter-spacing="1.5" opacity="0.5">FOCUS</text>
    <text x="110" y="100" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#F0EAE1" letter-spacing="1">APPLIED AI · FASTAPI · REACT</text>
    <line x1="0" y1="110" x2="303" y2="110" stroke="#CBD0D6" stroke-width="0.2" opacity="0.15"/>

    <!-- Row 4: Creative -->
    <text x="0" y="134" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#CBD0D6" letter-spacing="1.5" opacity="0.5">CREATIVE</text>
    <text x="110" y="134" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#F0EAE1" letter-spacing="1">CINEMATOGRAPHY · EDITING</text>
    <line x1="0" y1="144" x2="303" y2="144" stroke="#CBD0D6" stroke-width="0.2" opacity="0.15"/>

    <!-- Row 5: Status -->
    <text x="0" y="168" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#CBD0D6" letter-spacing="1.5" opacity="0.5">STATUS</text>
    <circle cx="114" cy="165" r="3.5" fill="#1E40AF"/>
    <text x="124" y="168" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" font-weight="700" fill="#1E40AF" letter-spacing="1.5">ACTIVE COMPILATION</text>
  </g>

  <!-- Bottom boundary hairline rule -->
  <line x1="32" y1="260" x2="868" y2="260" stroke="#CBD0D6" stroke-width="0.4" opacity="0.25"/>

  <!-- Registration corner tick -->
  <g stroke="#CBD0D6" stroke-width="0.5" opacity="0.4">
    <line x1="862" y1="260" x2="874" y2="260"/>
    <line x1="868" y1="254" x2="868" y2="266"/>
  </g>
</svg>

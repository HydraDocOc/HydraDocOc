  <text x="46" y="334"
        font-family="'IBM Plex Mono','SF Mono',Consolas,monospace"
        font-size="9.5"
        fill="#0A0D12"
        letter-spacing="0.5"
        opacity="0.85">Applied machine learning, end-to-end web systems, and cinematic design systems.</text>


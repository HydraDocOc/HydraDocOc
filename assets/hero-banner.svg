  <text x="640" y="38" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8" fill="#0A0D12" letter-spacing="1" opacity="0.7">28.6139° N, 77.2090° E · NEW DELHI, IN</text>

  <!-- Sub-masthead hairline rule -->
  <line x1="32" y1="48" x2="868" y2="48" stroke="#0A0D12" stroke-width="0.5" opacity="0.3"/>

  <!-- Technical scale ruler ticks -->
  <g stroke="#0A0D12" stroke-width="0.4" opacity="0.4">
    <line x1="32" y1="52" x2="32" y2="58"/>
    <line x1="132" y1="52" x2="132" y2="56"/>
    <line x1="232" y1="52" x2="232" y2="56"/>
    <line x1="332" y1="52" x2="332" y2="56"/>
    <line x1="432" y1="52" x2="432" y2="56"/>
    <line x1="532" y1="52" x2="532" y2="56"/>
    <line x1="632" y1="52" x2="632" y2="56"/>
    <line x1="732" y1="52" x2="732" y2="56"/>
    <line x1="832" y1="52" x2="832" y2="56"/>

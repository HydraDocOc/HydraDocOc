    <line x1="32" y1="14" x2="32" y2="26"/>
    <line x1="862" y1="20" x2="874" y2="20"/>
    <line x1="868" y1="14" x2="868" y2="26"/>
    <line x1="26" y1="460" x2="38" y2="460"/>
    <line x1="32" y1="454" x2="32" y2="466"/>
    <line x1="862" y1="460" x2="874" y2="460"/>
    <line x1="868" y1="454" x2="868" y2="466"/>

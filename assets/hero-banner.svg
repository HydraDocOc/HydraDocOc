    <ellipse cx="0" cy="0" rx="80" ry="24" fill="none" stroke="#1E40AF" stroke-width="0.5" stroke-dasharray="3,3" transform="rotate(35)" opacity="0.5"/>

    <!-- Orbital nodes -->
    <circle cx="68" cy="-45" r="3.5" fill="#0A0D12"/>
    <circle cx="-82" cy="22" r="2.5" fill="#1E40AF"/>
    <circle cx="34" cy="62" r="2" fill="#0A0D12" opacity="0.6"/>

    <!-- Telemetry annotations -->
    <text x="10" y="-102" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#0A0D12" opacity="0.6">CAL · R:96mm</text>
    <text x="42" y="-38" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#1E40AF" font-weight="600">NODE.01</text>
    <text x="-124" y="-8" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#0A0D12" opacity="0.5">-X</text>
    <text x="112" y="-8" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="6.5" fill="#0A0D12" opacity="0.5">+X</text>
  </g>


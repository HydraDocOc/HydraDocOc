    <circle cx="0" cy="0" r="120" fill="none" stroke="#0A0D12" stroke-width="0.4" stroke-dasharray="2,4" opacity="0.35"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#0A0D12" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#0A0D12" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#1E40AF" stroke-width="0.9" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#1E40AF"/>

    <!-- Coordinate Crosshairs -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#0A0D12" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#0A0D12" stroke-width="0.5" opacity="0.4"/>

    <!-- 45-degree angle calipers -->

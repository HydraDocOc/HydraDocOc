    <text x="0" y="14" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" fill="#0A0D12" opacity="0.85">Applied AI &amp; Retrieval</text>
    <text x="0" y="27" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" fill="#0A0D12" opacity="0.5">LangChain · Gemini · Vector Search</text>

    <text x="170" y="0" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7.5" font-weight="700" fill="#1E40AF" letter-spacing="2">CORE AXIS 02</text>
    <text x="170" y="14" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="8.5" fill="#0A0D12" opacity="0.85">Full-Stack Web Systems</text>
    <text x="170" y="27" font-family="'IBM Plex Mono','SF Mono',Consolas,monospace" font-size="7" fill="#0A0D12" opacity="0.5">FastAPI · React · Flask · Django</text>

